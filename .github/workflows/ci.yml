name: CI

# The reusable workflows live in ion-repo (antoine-tena/ion-repo, public), cited at the ion-repo release the
# project comes from (develop): `ion repo update` moves them to the next one. The project only
# keeps its parameters here.
on:
  # Only on the way to main: a release branch. A merge into develop runs fast linters only.
  push:
    branches: [ "release/**" ]
  # Callable from another workflow of the repo.
  workflow_call:

# [WORKFLOW-PERMISSIONS]: the token reads the repo, nothing more; ion-repo's workflows need no more.
permissions:
  contents: read

jobs:

  charter:
    uses: antoine-tena/ion-repo/.github/workflows/charter.yml@9c8373b67d6bfd371960a41b6f213b3b524f0925 # develop

  # [SECRETS]: gitleaks searches the whole history, with no organisation licence.
  secrets-scan:
    uses: antoine-tena/ion-repo/.github/workflows/secrets.yml@9c8373b67d6bfd371960a41b6f213b3b524f0925 # develop
